name: validate-submission
on:
  pull_request:
    paths:
      - 'artifacts/incoming/**'
      - 'artifacts/writing/**'
  push:
    paths:
      - 'artifacts/incoming/**'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 校验新增/修改的产物
        id: check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD -- 'artifacts/incoming/*.md' 'artifacts/writing/*.md')
          else
            files=$(git diff --name-only "${{ github.event.before }}" HEAD -- 'artifacts/incoming/*.md')
          fi
          echo "files=$files"
          if [ -z "$files" ]; then
            echo "✅ 无待校验文件"
            exit 0
          fi
          python3 scripts/check_submission.py $files
        shell: bash
      - name: 收集校验输出(失败时)
        if: failure()
        id: collect
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD -- 'artifacts/incoming/*.md' 'artifacts/writing/*.md')
          else
            files=$(git diff --name-only "${{ github.event.before }}" HEAD -- 'artifacts/incoming/*.md')
          fi
          for f in $files; do python3 scripts/check_submission.py "$f" || true; done > /tmp/check_out.txt
          echo "output<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/check_out.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - name: PR 评论结果
        if: github.event_name == 'pull_request' && steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const out = process.env.CHECK_OUTPUT || '';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 产物规范校验 ✗\n\n\`\`\`\n${out}\n\`\`\`\n请按 [编写规范](../craft/编写规范.md) 修正后重新推送。`
            });
        env:
          CHECK_OUTPUT: ${{ steps.collect.outputs.output }}
