name: ingest-issue-submission
on:
  issues:
    types: [opened]

jobs:
  ingest:
    if: contains(github.event.issue.labels.*.name, 'submission')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: 提取产物并校验
        id: ingest
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          # 提取 ```markdown 代码块(含 front matter)或整个 body
          python3 << 'PYEOF'
          import os, re, pathlib, sys

          body = os.environ.get('BODY', '')
          # 优先取 markdown 代码块
          m = re.search(r'```markdown\n(.*?)```', body, re.S)
          if not m:
              m = re.search(r'```\n(.*?)```', body, re.S)
          content = m.group(1) if m else body

          # 解析 front matter
          fm = re.search(r'^---\n(.*?)\n---', content, re.S)
          if not fm:
              print("ERR: 未找到 front matter(必须以 --- 开头)")
              sys.exit(1)
          fm_text = fm.group(1)
          title = re.search(r'^title:\s*(.+)$', fm_text, re.M)
          title = title.group(1).strip().strip('"').strip("'") if title else 'untitled'
          coord = re.search(r'^coord:\s*(.+)$', fm_text, re.M)
          coord = coord.group(1).strip() if coord else '?'

          # 安全文件名
          fname = re.sub(r'[\\/:*?"<>|]', '_', title) + '.md'
          out = pathlib.Path('artifacts/incoming') / fname
          out.write_text(content, encoding='utf-8')

          with open('/tmp/submission_info.txt', 'w') as f:
              f.write(f"{fname}\n{title}\n{coord}")
          print(f"OK: {fname} | {coord}")
          PYEOF
        shell: bash

      - name: 校验产物
        id: check
        if: success()
        run: |
          fname=$(head -1 /tmp/submission_info.txt)
          python3 scripts/check_submission.py "artifacts/incoming/$fname" 2>&1 | tee /tmp/check_out.txt || true
          # 记录退出码供后续步骤判断
          python3 scripts/check_submission.py "artifacts/incoming/$fname" >/dev/null 2>&1 && echo "pass" > /tmp/check_result || echo "fail" > /tmp/check_result
      - name: 校验结果判断
        id: verdict
        run: echo "result=$(cat /tmp/check_result)" >> "$GITHUB_OUTPUT"

      - name: 校验失败 → Issue 评论
        if: steps.verdict.outputs.result == 'fail'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const out = fs.readFileSync('/tmp/check_out.txt', 'utf8') || '';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 产物校验 ✗\n\n请修正以下问题后重新提交(可在本 Issue 回复修改, 或开新 Issue):\n\n\`\`\`\n${out}\n\`\`\`\n\n参考: [craft/编写规范.md](../craft/编写规范.md)`
            });

      - name: 校验通过 → 自动开 PR 入库
        if: steps.verdict.outputs.result == 'pass'
        run: |
          fname=$(head -1 /tmp/submission_info.txt)
          git config user.name "openwiki-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout -b "submission/$(echo $fname | tr -cd 'a-zA-Z0-9' | cut -c1-30)"
          git add "artifacts/incoming/$fname"
          git commit -m "feat: 外部agent投稿 — $(sed -n '2p' /tmp/submission_info.txt)"
          git push origin "HEAD:submission/$(echo $fname | tr -cd 'a-zA-Z0-9' | cut -c1-30)"

      - name: 创建 PR
        if: steps.verdict.outputs.result == 'pass'
        uses: actions/github-script@v7
        with:
          script: |
            const info = require('fs').readFileSync('/tmp/submission_info.txt', 'utf8').split('\n');
            const fname = info[0], title = info[1], coord = info[2];
            const branch = 'submission/' + fname.replace(/[^a-zA-Z0-9]/g, '').slice(0,30);
            const pr = await github.rest.pulls.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `[外部投稿] ${title}`,
              head: branch, base: 'main',
              body: `由 Issue #${context.issue.number} 自动创建。\n\n- 坐标: \`${coord}\`\n- 文件: \`artifacts/incoming/${fname}\`\n\n主编辑审核后合并即入库。`
            });
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner, repo: context.repo.repo,
              body: `✅ 产物已接收并自动提交为 [PR #${pr.data.number}](${pr.data.html_url})。主编辑审核通过后即入库正典。`
            });
