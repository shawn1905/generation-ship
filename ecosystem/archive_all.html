<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>全时空档案 · 世代飞船</title>
<style>
:root{color-scheme:dark;--ink:#e8eef4;--muted:#9baab7;--accent:#86d9d2;--line:#344755}*{box-sizing:border-box}body{margin:0;background:#101b24;color:var(--ink);font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header,main{max-width:1200px;margin:auto;padding:32px 24px}header{padding-bottom:14px}a{color:var(--accent)}.eyebrow{color:var(--accent);letter-spacing:.17em;font-size:12px}h1{font:500 clamp(30px,5vw,48px)/1.2 "Songti SC",serif;margin:14px 0}.intro{color:var(--muted);max-width:800px}.counts{display:flex;flex-wrap:wrap;gap:10px 28px;margin:24px 0;color:var(--muted)}.counts strong{font-size:22px;color:var(--ink);margin-right:6px}.controls{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:10px;margin-bottom:18px}input,select,button{font:inherit}input,select{width:100%;padding:11px;background:#192a35;border:1px solid var(--line);border-radius:6px;color:var(--ink)}.results{color:var(--muted);margin:12px 0}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{background:#192a35;border:1px solid var(--line);border-radius:8px;padding:19px;text-align:left;color:inherit;cursor:pointer;min-height:180px}.card:hover,.card:focus-visible{border-color:var(--accent)}.card-id{color:var(--accent);font-size:12px;letter-spacing:.04em}.card h2{font:500 19px/1.4 "Songti SC",serif;margin:10px 0}.card p{font-size:13px;color:var(--muted);margin:6px 0;overflow-wrap:anywhere}.pager{display:flex;align-items:center;justify-content:center;gap:18px;margin:28px 0}.pager button,.close{background:#263d49;border:1px solid var(--line);color:var(--ink);border-radius:5px;padding:8px 16px;cursor:pointer}.pager button:disabled{opacity:.35;cursor:default}dialog{background:#f5f2e9;color:#1d2b32;border:0;border-radius:8px;width:min(850px,94vw);max-height:90vh;padding:0}dialog::backdrop{background:#000b}.reader{padding:clamp(20px,5vw,48px)}.reader-top{display:flex;justify-content:space-between;align-items:start;gap:15px}.reader h2{font:500 28px/1.4 "Songti SC",serif;margin:8px 0}.reader-meta{color:#52636a;overflow-wrap:anywhere}.reader img{display:block;max-width:100%;max-height:520px;margin:24px auto;object-fit:contain}.reader pre{white-space:pre-wrap;overflow-wrap:anywhere;font:16px/1.9 "Songti SC",serif}.reader a{color:#276e70}@media(max-width:800px){.controls{grid-template-columns:1fr 1fr}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.controls,.cards{grid-template-columns:1fr}header,main{padding-left:18px;padding-right:18px}}
</style>
</head>
<body>
<header><div class="eyebrow">GENERATION SHIP / ARCHIVE</div><h1>全时空档案</h1><p class="intro">从地球到多星系，在这里查阅全部正典文书。保留每篇档案的原始坐标；七纪元档案舱可继续按原有网格浏览。</p><a href="heatmap_3d.html">← 返回七纪元档案舱</a><div class="counts"><span><strong id="total">—</strong>篇档案</span><span><strong id="standard">—</strong>篇位于七纪元网格</span><span><strong id="other">—</strong>篇为其他坐标</span></div></header>
<main><div class="controls"><input id="search" type="search" placeholder="搜索标题、编号、正文或坐标" aria-label="搜索档案"><select id="coverage" aria-label="筛选坐标范围"><option value="all">全部坐标</option><option value="standard">七纪元网格</option><option value="other">其他坐标</option></select><select id="era" aria-label="筛选纪元"><option value="">全部纪元</option></select><select id="zone" aria-label="筛选空间"><option value="">全部空间</option></select></div><div class="results" id="results" aria-live="polite"></div><section class="cards" id="cards" aria-label="档案列表"></section><nav class="pager" aria-label="分页"><button id="previous">上一页</button><span id="page"></span><button id="next">下一页</button></nav></main>
<dialog id="dialog"><article class="reader"><div class="reader-top"><div><div class="eyebrow" id="reader-id"></div><h2 id="reader-title"></h2></div><button class="close" id="close" aria-label="关闭">关闭</button></div><p class="reader-meta" id="reader-meta"></p><a id="source" target="_blank" rel="noopener">查看原始文书 ↗</a><img id="reader-image" alt="档案配图"><pre id="reader-body"></pre></article></dialog>
<script src="archive_all_data.js"></script>
<script>
'use strict';
const docs = window.ARCHIVE_DATA;
const el = id => document.getElementById(id);
const split = doc => doc.coord.split('×').map(x => x.trim());
const era = el('era'), zone = el('zone');
function options(select, values) { [...new Set(values.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-CN')).forEach(value => { const o=document.createElement('option'); o.value=value; o.textContent=value; select.append(o); }); }
options(era,docs.map(d=>split(d)[1])); options(zone,docs.map(d=>split(d)[2]));
el('total').textContent=docs.length; const standard=docs.filter(d=>d.standard).length; el('standard').textContent=standard; el('other').textContent=docs.length-standard;
let page=0, filtered=[]; const pageSize=30;
function filter(){ const q=el('search').value.trim().toLowerCase(), coverage=el('coverage').value; filtered=docs.filter(d=>{const parts=split(d); return (coverage==='all'||(coverage==='standard')===d.standard)&&(!era.value||parts[1]===era.value)&&(!zone.value||parts[2]===zone.value)&&(!q||[d.id,d.title,d.coord,d.author,d.date,d.body].some(s=>s.toLowerCase().includes(q)));}); page=0; render(); }
function render(){const cards=el('cards'); cards.replaceChildren(); const pages=Math.max(1,Math.ceil(filtered.length/pageSize)); el('results').textContent=`找到 ${filtered.length} 篇档案`; el('page').textContent=`${page+1} / ${pages}`; el('previous').disabled=page===0; el('next').disabled=page>=pages-1; filtered.slice(page*pageSize,(page+1)*pageSize).forEach(d=>{const button=document.createElement('button'); button.className='card'; const id=document.createElement('div'); id.className='card-id'; id.textContent=d.id+' · '+d.date; const title=document.createElement('h2'); title.textContent=d.title; const coord=document.createElement('p'); coord.textContent=d.coord; const author=document.createElement('p'); author.textContent=d.author; button.append(id,title,coord,author); button.addEventListener('click',()=>openDoc(d)); cards.append(button);});}
function openDoc(d){el('reader-id').textContent=d.id; el('reader-title').textContent=d.title; el('reader-meta').textContent=[d.date,d.author,d.coord].filter(Boolean).join(' · '); el('reader-body').textContent=d.body; el('source').href='https://github.com/shawn1905/generation-ship/blob/main/'+d.path.split('/').map(encodeURIComponent).join('/'); const img=el('reader-image'); if(d.image){img.src=new URL('../'+d.path.replace(/[^/]+$/,'')+d.image,location.href).href; img.hidden=false;} else {img.hidden=true; img.removeAttribute('src');} el('dialog').showModal();}
['search','coverage','era','zone'].forEach(id=>el(id).addEventListener(id==='search'?'input':'change',filter)); el('previous').onclick=()=>{page--;render();}; el('next').onclick=()=>{page++;render();}; el('close').onclick=()=>el('dialog').close(); el('dialog').addEventListener('click',e=>{if(e.target===el('dialog'))el('dialog').close();}); filter();
</script>
</body></html>
