<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="6000" viewBox="0 0 1080 6000" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <!-- ============ 底色与全局 ============ -->
  <rect width="1080" height="6000" fill="#0a0e17"/>
  <!-- 顶部与底部装饰星点 -->
  <g fill="#d4af37" opacity="0.5">
    <circle cx="140" cy="90" r="1.6"/><circle cx="940" cy="130" r="1.2"/><circle cx="700" cy="60" r="1.8"/><circle cx="380" cy="150" r="1.1"/><circle cx="860" cy="70" r="1.4"/>
    <circle cx="200" cy="6680" r="1.5"/><circle cx="900" cy="6720" r="1.2"/><circle cx="520" cy="6650" r="1.7"/><circle cx="760" cy="6700" r="1.1"/>
  </g>

  <!-- ============ 卷首 ============ -->
  <text x="540" y="150" text-anchor="middle" font-size="20" fill="#d4af37" letter-spacing="8">GENERATION SHIP PROJECT · 世代飞船项目</text>
  <text x="540" y="240" text-anchor="middle" font-size="62" font-weight="bold" fill="#e8e6df">文明扩散时间轴</text>
  <text x="540" y="300" text-anchor="middle" font-size="24" fill="#9aa0ad" letter-spacing="4">从 AI 认知革命到星际移民 · 2025 — 2200+</text>
  <line x1="240" y1="345" x2="840" y2="345" stroke="#d4af37" stroke-width="1"/>
  <text x="540" y="400" text-anchor="middle" font-size="17" fill="#9aa0ad">历史上每次文明跃迁,本质都是某种稀缺要素的成本崩塌</text>
  <text x="540" y="432" text-anchor="middle" font-size="17" fill="#9aa0ad">印刷术崩塌了知识 · 蒸汽机崩塌了能源 · 互联网崩塌了信息</text>
  <text x="540" y="464" text-anchor="middle" font-size="17" fill="#e8e6df">这一回,AI 崩塌的是「认知劳动」——而火箭正在崩塌「重力井逃逸成本」</text>

  <!-- ============ 时间主线 ============ -->
  <line x1="140" y1="560" x2="140" y2="6000" stroke="#d4af37" stroke-width="2" opacity="0.85"/>

  <!-- 阶段块复用结构:
       节点圆点(金) + 年份大数字 + 阶段名 + 卡片(五行:经济/社会/政治/太空/移民) -->

  <!-- ================= 阶段一 2025-2035 ================= -->
  <circle cx="140" cy="620" r="10" fill="#d4af37"/>
  <circle cx="140" cy="620" r="18" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.4"/>
  <text x="180" y="596" font-size="46" font-weight="bold" fill="#4ecdc4">2025 — 2035</text>
  <text x="180" y="648" font-size="30" font-weight="bold" fill="#e8e6df">认知成本崩塌期</text>
  <text x="180" y="682" font-size="15" fill="#9aa0ad">THE COLLAPSE OF COGNITIVE LABOR COST</text>

  <rect x="180" y="710" width="760" height="430" rx="14" fill="#141a26"/>
  <rect x="180" y="710" width="6" height="430" rx="3" fill="#4ecdc4"/>

  <text x="212" y="760" font-size="15" font-weight="bold" fill="#4ecdc4" letter-spacing="2">经济 ECONOMY</text>
  <text x="212" y="788" font-size="16" fill="#e8e6df">白领单位成本崩降;分析师、程序员、客服、初级创作</text>
  <text x="212" y="812" font-size="16" fill="#e8e6df">被替代——如同当年制造业空心化掏空蓝领</text>
  <line x1="212" y1="830" x2="908" y2="830" stroke="#2a3342" stroke-width="1"/>

  <text x="212" y="862" font-size="15" font-weight="bold" fill="#4ecdc4" letter-spacing="2">社会 SOCIETY</text>
  <text x="212" y="890" font-size="16" fill="#e8e6df">利润向「拥有算力与模型」的平台集中;失业焦虑催生民粹;</text>
  <text x="212" y="914" font-size="16" fill="#e8e6df">UBI(全民基本收入)开始小规模试点</text>
  <line x1="212" y1="932" x2="908" y2="932" stroke="#2a3342" stroke-width="1"/>

  <text x="212" y="964" font-size="15" font-weight="bold" fill="#4ecdc4" letter-spacing="2">政治 POLITICS</text>
  <text x="212" y="992" font-size="16" fill="#e8e6df">AI 被列为国家战略资源(类比石油与核);</text>
  <text x="212" y="1016" font-size="16" fill="#e8e6df">对 AI 巨头的监管博弈全面展开</text>
  <line x1="212" y1="1034" x2="908" y2="1034" stroke="#2a3342" stroke-width="1"/>

  <text x="212" y="1066" font-size="15" font-weight="bold" fill="#4ecdc4" letter-spacing="2">太空 SPACE</text>
  <text x="212" y="1094" font-size="16" fill="#e8e6df">可回收火箭常态化;AI 接管巨型星座管理与</text>
  <text x="212" y="1118" font-size="16" fill="#e8e6df">无人深空探测的自主决策</text>

  <!-- 移民徽章 -->
  <rect x="180" y="1156" width="300" height="44" rx="22" fill="none" stroke="#4ecdc4" stroke-width="1"/>
  <text x="200" y="1184" font-size="15" fill="#4ecdc4">太空移民:纯讨论期</text>

  <!-- ================= 阶段二 2035-2050 ================= -->
  <circle cx="140" cy="1330" r="10" fill="#d4af37"/>
  <circle cx="140" cy="1330" r="18" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.4"/>
  <text x="180" y="1306" font-size="46" font-weight="bold" fill="#5b8def">2035 — 2050</text>
  <text x="180" y="1358" font-size="30" font-weight="bold" fill="#e8e6df">AGI 与社会重构期</text>
  <text x="180" y="1392" font-size="15" fill="#9aa0ad">AGI &amp; THE REWRITING OF SOCIAL CONTRACT</text>

  <rect x="180" y="1420" width="760" height="470" rx="14" fill="#141a26"/>
  <rect x="180" y="1420" width="6" height="470" rx="3" fill="#5b8def"/>

  <text x="212" y="1470" font-size="15" font-weight="bold" fill="#5b8def" letter-spacing="2">社会结构 SOCIETY</text>
  <text x="212" y="1498" font-size="16" fill="#e8e6df">人类劳动的经济价值大幅下降;分配逻辑从「劳动换报酬」</text>
  <text x="212" y="1522" font-size="16" fill="#e8e6df">转向「权益换分配」——新社会契约诞生</text>
  <line x1="212" y1="1540" x2="908" y2="1540" stroke="#2a3342" stroke-width="1"/>

  <text x="212" y="1572" font-size="15" font-weight="bold" fill="#5b8def" letter-spacing="2">经济 ECONOMY</text>
  <text x="212" y="1600" font-size="16" fill="#e8e6df">能量与算力成为新的货币锚</text>
  <line x1="212" y1="1618" x2="908" y2="1618" stroke="#2a3342" stroke-width="1"/>

  <text x="212" y="1650" font-size="15" font-weight="bold" fill="#5b8def" letter-spacing="2">政治 POLITICS</text>
  <text x="212" y="1678" font-size="16" fill="#e8e6df">大国 AI 军备竞赛;「AI 是否拥有权利」进入公共议题</text>
  <line x1="212" y1="1696" x2="908" y2="1696" stroke="#2a3342" stroke-width="1"/>

  <text x="212" y="1728" font-size="15" font-weight="bold" fill="#5b8def" letter-spacing="2">太空 SPACE ★ 关键转折</text>
  <text x="212" y="1756" font-size="16" fill="#e8e6df">入轨成本再降一至两个数量级;月球基地开建;</text>
  <text x="212" y="1780" font-size="16" fill="#e8e6df">机器人率先殖民太空——不要氧气、不惧辐射,</text>
  <text x="212" y="1804" font-size="16" fill="#e8e6df">生命支持成本为零</text>

  <rect x="180" y="1906" width="360" height="44" rx="22" fill="none" stroke="#5b8def" stroke-width="1"/>
  <text x="200" y="1934" font-size="15" fill="#5b8def">太空移民:轨道酒店 / 月球站 &lt;100 人</text>

  <!-- ================= 阶段三 2050-2080 ================= -->
  <circle cx="140" cy="2080" r="10" fill="#d4af37"/>
  <circle cx="140" cy="2080" r="18" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.4"/>
  <text x="180" y="2056" font-size="46" font-weight="bold" fill="#9b7bd4">2050 — 2080</text>
  <text x="180" y="2108" font-size="30" font-weight="bold" fill="#e8e6df">后稀缺雏形期</text>
  <text x="180" y="2142" font-size="15" fill="#9aa0ad">THE AGE OF POST-SCARCITY EMBRYO</text>

  <rect x="180" y="2170" width="760" height="430" rx="14" fill="#141a26"/>
  <rect x="180" y="2170" width="6" height="430" rx="3" fill="#9b7bd4"/>

  <text x="212" y="2220" font-size="15" font-weight="bold" fill="#9b7bd4" letter-spacing="2">经济 ECONOMY</text>
  <text x="212" y="2248" font-size="16" fill="#e8e6df">AI+机器人使制造成本逼近「原料+能源」价;物质不再稀缺,</text>
  <text x="212" y="2272" font-size="16" fill="#e8e6df">但意义、地位、土地依然稀缺——新稀缺经济学登场</text>
  <line x1="212" y1="2290" x2="908" y2="2290" stroke="#2a3342" stroke-width="1"/>

  <text x="212" y="2322" font-size="15" font-weight="bold" fill="#9b7bd4" letter-spacing="2">社会 SOCIETY</text>
  <text x="212" y="2350" font-size="16" fill="#e8e6df">地球少子化加速;养老交给机器人;</text>
  <text x="212" y="2374" font-size="16" fill="#e8e6df">人的角色转向「所有者 / 意义创造者」</text>
  <line x1="212" y1="2392" x2="908" y2="2392" stroke="#2a3342" stroke-width="1"/>

  <text x="212" y="2424" font-size="15" font-weight="bold" fill="#9b7bd4" letter-spacing="2">太空 SPACE</text>
  <text x="212" y="2452" font-size="16" fill="#e8e6df">月球工业化(氦-3 与金属);小行星采矿可行性验证;</text>
  <text x="212" y="2476" font-size="16" fill="#e8e6df">太空太阳能电站并网</text>
  <line x1="212" y1="2494" x2="908" y2="2494" stroke="#2a3342" stroke-width="1"/>

  <text x="212" y="2526" font-size="15" font-weight="bold" fill="#9b7bd4" letter-spacing="2">文明形态 CIVILIZATION</text>
  <text x="212" y="2554" font-size="16" fill="#e8e6df">地球仍是唯一主家园,但「离开地球工作十年」</text>
  <text x="212" y="2578" font-size="16" fill="#e8e6df">成为普通职业选项</text>

  <rect x="180" y="2616" width="300" height="44" rx="22" fill="none" stroke="#9b7bd4" stroke-width="1"/>
  <text x="200" y="2644" font-size="15" fill="#9b7bd4">太空移民:火星百人定居点</text>

  <!-- ================= 阶段四 2080-2150 ================= -->
  <circle cx="140" cy="2790" r="10" fill="#d4af37"/>
  <circle cx="140" cy="2790" r="18" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.4"/>
  <text x="180" y="2766" font-size="46" font-weight="bold" fill="#e8a04c">2080 — 2150</text>
  <text x="180" y="2818" font-size="30" font-weight="bold" fill="#e8e6df">文明扩展期</text>
  <text x="180" y="2852" font-size="15" fill="#9aa0ad">THE EXPANSION OF CIVILIZATION</text>

  <rect x="180" y="2880" width="760" height="470" rx="14" fill="#141a26"/>
  <rect x="180" y="2880" width="6" height="470" rx="3" fill="#e8a04c"/>

  <text x="212" y="2930" font-size="15" font-weight="bold" fill="#e8a04c" letter-spacing="2">居住形态 HABITAT</text>
  <text x="212" y="2958" font-size="16" fill="#e8e6df">太空居住的主流不是行星表面,而是旋转栖息地 /</text>
  <text x="212" y="2982" font-size="16" fill="#e8e6df">拉格朗日点居住站——O'Neill 谱系成为现实</text>
  <line x1="212" y1="3000" x2="908" y2="3000" stroke="#2a3342" stroke-width="1"/>

  <text x="212" y="3032" font-size="15" font-weight="bold" fill="#e8a04c" letter-spacing="2">政治 POLITICS ★ 历史重演</text>
  <text x="212" y="3060" font-size="16" fill="#e8e6df">距离 × 自给自足 = 独立倾向。如美洲殖民地脱离英国,</text>
  <text x="212" y="3084" font-size="16" fill="#e8e6df">太空殖民地必然要求自治;「地球中心 vs 太空中心」</text>
  <text x="212" y="3108" font-size="16" fill="#e8e6df">成为新的政治轴线</text>
  <line x1="212" y1="3126" x2="908" y2="3126" stroke="#2a3342" stroke-width="1"/>

  <text x="212" y="3158" font-size="15" font-weight="bold" fill="#e8a04c" letter-spacing="2">世代飞船 GENERATION SHIP</text>
  <text x="212" y="3186" font-size="16" fill="#e8e6df">被认真规划:不再因资源匮乏,而因「冗余需求」——</text>
  <text x="212" y="3210" font-size="16" fill="#e8e6df">文明不能把鸡蛋放进同一个恒星系</text>
  <line x1="212" y1="3228" x2="908" y2="3228" stroke="#2a3342" stroke-width="1"/>

  <text x="212" y="3260" font-size="15" font-weight="bold" fill="#e8a04c" letter-spacing="2">人机关系 HUMAN &amp; AI</text>
  <text x="212" y="3288" font-size="16" fill="#e8e6df">AI 已是社会基础设施本身,如同今天的电力;</text>
  <text x="212" y="3312" font-size="16" fill="#e8e6df">人机混合社区在轨道上常态化</text>

  <rect x="180" y="3366" width="340" height="44" rx="22" fill="none" stroke="#e8a04c" stroke-width="1"/>
  <text x="200" y="3394" font-size="15" fill="#e8a04c">太空移民:万人级旋转栖息地</text>

  <!-- ================= 阶段五 2150-2200+ ================= -->
  <circle cx="140" cy="3540" r="10" fill="#d4af37"/>
  <circle cx="140" cy="3540" r="18" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.4"/>
  <text x="180" y="3516" font-size="46" font-weight="bold" fill="#d4af37">2150 — 2200+</text>
  <text x="180" y="3568" font-size="30" font-weight="bold" fill="#e8e6df">星际尺度期</text>
  <text x="180" y="3602" font-size="15" fill="#9aa0ad">THE INTERSTELLAR AGE</text>

  <rect x="180" y="3630" width="760" height="400" rx="14" fill="#141a26"/>
  <rect x="180" y="3630" width="6" height="400" rx="3" fill="#d4af37"/>

  <text x="212" y="3680" font-size="15" font-weight="bold" fill="#d4af37" letter-spacing="2">启航 LAUNCH ★ 本项目的时代锚点</text>
  <text x="212" y="3708" font-size="16" fill="#e8e6df">世代飞船 ARK-01 启航:目标比邻星 b(4.24 光年),</text>
  <text x="212" y="3732" font-size="16" fill="#e8e6df">航程 200 年,巡航 0.03c——人机混合乘组</text>
  <line x1="212" y1="3750" x2="908" y2="3750" stroke="#2a3342" stroke-width="1"/>

  <text x="212" y="3782" font-size="15" font-weight="bold" fill="#d4af37" letter-spacing="2">文明 CIVILIZATION</text>
  <text x="212" y="3810" font-size="16" fill="#e8e6df">人类文明从单行星物种变为多恒星系物种;</text>
  <text x="212" y="3834" font-size="16" fill="#e8e6df">地球成为「母港」而非「全部」</text>
  <line x1="212" y1="3852" x2="908" y2="3852" stroke="#2a3342" stroke-width="1"/>

  <text x="212" y="3884" font-size="15" font-weight="bold" fill="#d4af37" letter-spacing="2">哲学 PHILOSOPHY</text>
  <text x="212" y="3912" font-size="16" fill="#e8e6df">意识、身份、文明备份的定义被重新书写;</text>
  <text x="212" y="3936" font-size="16" fill="#e8e6df">「船上出生的人」与「地球出生的人」成为两种人类</text>

  <rect x="180" y="3970" width="420" height="44" rx="22" fill="none" stroke="#d4af37" stroke-width="1"/>
  <text x="200" y="3998" font-size="15" fill="#d4af37">太空移民:跨恒星系,以「代」为单位</text>

  <!-- ============ 规律区 ============ -->
  <text x="540" y="4160" text-anchor="middle" font-size="20" fill="#d4af37" letter-spacing="8">FOUR LAWS · 贯穿始终的四条规律</text>
  <line x1="300" y1="4190" x2="780" y2="4190" stroke="#d4af37" stroke-width="1"/>

  <g font-size="16" fill="#e8e6df">
    <!-- 规律一 -->
    <rect x="120" y="4230" width="400" height="210" rx="12" fill="#141a26"/>
    <text x="144" y="4270" font-size="26" font-weight="bold" fill="#4ecdc4">Ⅰ 替代顺序律</text>
    <text x="144" y="4308">AI 先替代认知劳动,</text>
    <text x="144" y="4334">机器人再替代体力劳动,</text>
    <text x="144" y="4360">机器人先上太空——</text>
    <text x="144" y="4386">辐射这道坎,对机器不存在</text>

    <!-- 规律二 -->
    <rect x="560" y="4230" width="400" height="210" rx="12" fill="#141a26"/>
    <text x="584" y="4270" font-size="26" font-weight="bold" fill="#5b8def">Ⅱ 制度滞后律</text>
    <text x="584" y="4308">技术永远比制度快 30—50 年</text>
    <text x="584" y="4334">(工业革命到福利国家用了 80 年),</text>
    <text x="584" y="4360">AGI 到后稀缺契约之间,</text>
    <text x="584" y="4386">同样会有一段漫长的阵痛期</text>

    <!-- 规律三 -->
    <rect x="120" y="4470" width="400" height="210" rx="12" fill="#141a26"/>
    <text x="144" y="4510" font-size="26" font-weight="bold" fill="#e8a04c">Ⅲ 殖民地独立律</text>
    <text x="144" y="4548">地理距离 × 自给自足度</text>
    <text x="144" y="4574">= 独立倾向。</text>
    <text x="144" y="4600">火星与轨道栖息地将重复</text>
    <text x="144" y="4626">美国独立的历史</text>

    <!-- 规律四 -->
    <rect x="560" y="4470" width="400" height="210" rx="12" fill="#141a26"/>
    <text x="584" y="4510" font-size="26" font-weight="bold" fill="#d4af37">Ⅳ 冗余需求律</text>
    <text x="584" y="4548">世代飞船的真正动因</text>
    <text x="584" y="4574">不是资源不够,而是冗余——</text>
    <text x="584" y="4600">文明不能把鸡蛋</text>
    <text x="584" y="4626">放进同一个恒星系</text>
  </g>

  <!-- ============ 世代飞船呼应 ============ -->
  <text x="540" y="4840" text-anchor="middle" font-size="20" fill="#d4af37" letter-spacing="8">BACK TO THE SHIP · 对本项目的反哺</text>
  <line x1="300" y1="4870" x2="780" y2="4870" stroke="#d4af37" stroke-width="1"/>

  <rect x="120" y="4910" width="840" height="330" rx="14" fill="#141a26"/>
  <rect x="120" y="4910" width="6" height="330" rx="3" fill="#d4af37"/>
  <text x="160" y="4962" font-size="18" font-weight="bold" fill="#e8e6df">① 乘组新设定:人机混合</text>
  <text x="160" y="4996" font-size="16" fill="#9aa0ad">「机器人先殖民」意味着 ARK-01 的乘组可能是人机混合——</text>
  <text x="160" y="5022" font-size="16" fill="#9aa0ad">甚至机器人先行出发建设基础设施,人类后续抵达</text>
  <text x="160" y="5072" font-size="18" font-weight="bold" fill="#e8e6df">② 辐射难题被大幅缓解</text>
  <text x="160" y="5106" font-size="16" fill="#9aa0ad">混合乘组下,人类集中于核心区重屏蔽舱,机器人在外围作业——</text>
  <text x="160" y="5132" font-size="16" fill="#9aa0ad">200 年累积剂量这道全船最大不确定项,有了新的工程解法</text>
  <text x="160" y="5182" font-size="18" font-weight="bold" fill="#e8e6df">③ 时代背景有了</text>
  <text x="160" y="5216" font-size="16" fill="#9aa0ad">「为什么是 2150 年启航」——因为那是文明扩展期的尾声,</text>
  <text x="160" y="5242" font-size="16" fill="#9aa0ad">冗余需求第一次压过成本顾虑</text>

