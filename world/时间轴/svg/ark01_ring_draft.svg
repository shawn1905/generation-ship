<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="800" fill="#070b16"/>
  <!-- 星空 -->
  <g fill="#ffffff">
    <circle cx="80" cy="120" r="1.2" opacity=".7"/><circle cx="150" cy="60" r=".8" opacity=".5"/>
    <circle cx="230" cy="180" r="1" opacity=".6"/><circle cx="320" cy="90" r="1.4" opacity=".8"/>
    <circle cx="410" cy="150" r=".9" opacity=".5"/><circle cx="500" cy="60" r="1.1" opacity=".7"/>
    <circle cx="590" cy="120" r=".7" opacity=".4"/><circle cx="700" cy="70" r="1.2" opacity=".7"/>
    <circle cx="790" cy="140" r=".9" opacity=".5"/><circle cx="880" cy="90" r="1.3" opacity=".8"/>
    <circle cx="960" cy="170" r=".8" opacity=".5"/><circle cx="1120" cy="90" r="1.1" opacity=".7"/>
    <circle cx="60" cy="300" r=".9" opacity=".5"/><circle cx="140" cy="420" r="1.2" opacity=".7"/>
    <circle cx="90" cy="560" r=".8" opacity=".5"/><circle cx="200" cy="660" r="1.1" opacity=".7"/>
    <circle cx="110" cy="740" r=".9" opacity=".5"/><circle cx="340" cy="720" r="1.2" opacity=".7"/>
    <circle cx="480" cy="680" r=".8" opacity=".5"/><circle cx="620" cy="730" r="1" opacity=".6"/>
    <circle cx="760" cy="690" r=".9" opacity=".5"/><circle cx="900" cy="720" r="1.2" opacity=".7"/>
    <circle cx="1040" cy="650" r=".8" opacity=".5"/><circle cx="1140" cy="560" r="1.1" opacity=".7"/>
    <circle cx="1160" cy="300" r=".9" opacity=".5"/><circle cx="1090" cy="420" r="1" opacity=".6"/>
    <circle cx="260" cy="330" r=".7" opacity=".4"/><circle cx="180" cy="250" r="1" opacity=".6"/>
    <circle cx="540" cy="220" r=".8" opacity=".45"/><circle cx="750" cy="250" r=".7" opacity=".4"/>
    <circle cx="380" cy="600" r=".9" opacity=".5"/><circle cx="860" cy="580" r=".8" opacity=".45"/>
  </g>

  <!-- 远处故乡:地球 -->
  <g>
    <circle cx="1050" cy="150" r="24" fill="#3b6ea5" opacity=".18"/>
    <circle cx="1050" cy="150" r="14" fill="#3b6ea5"/>
    <circle cx="1046" cy="146" r="5" fill="#5a9e6f" opacity=".85"/>
    <circle cx="1055" cy="154" r="3" fill="#5a9e6f" opacity=".7"/>
    <text x="1050" y="192" font-size="12" fill="#7d90b8" text-anchor="middle">地球 · 已不可返</text>
  </g>

  <!-- 标题 -->
  <text x="60" y="80" font-size="30" fill="#e8eefc" font-weight="bold">方舟号 ARK-01</text>
  <text x="60" y="108" font-size="14" fill="#8ea3cc">世代飞船 · 环形剖面概念草图(原创)</text>

  <!-- 等离子尾焰(引擎在右,飞船向左航行) -->
  <g fill="#7fd4ff">
    <ellipse cx="955" cy="400" rx="48" ry="13" opacity=".5"/>
    <ellipse cx="1020" cy="400" rx="70" ry="9" opacity=".28"/>
    <ellipse cx="1090" cy="400" rx="80" ry="5" opacity=".13"/>
  </g>

  <!-- 环体 -->
  <ellipse cx="640" cy="400" rx="290" ry="165" fill="#0e1526" stroke="#3a4a6b" stroke-width="2"/>
  <!-- 三带分区(粗弧) -->
  <path d="M 423.5 334 A 250 132 0 0 1 856.5 334" fill="none" stroke="#3f7d4e" stroke-width="46" opacity=".9"/>
  <path d="M 856.5 334 A 250 132 0 0 1 640 532" fill="none" stroke="#c9a04a" stroke-width="46" opacity=".9"/>
  <path d="M 640 532 A 250 132 0 0 1 423.5 334" fill="none" stroke="#3a6f9e" stroke-width="46" opacity=".9"/>
  <!-- 城市灯光点阵(城市带上) -->
  <g fill="#ffe9b0">
    <circle cx="830" cy="370" r="2"/><circle cx="845" cy="398" r="1.6"/><circle cx="820" cy="428" r="2"/>
    <circle cx="790" cy="455" r="1.6"/><circle cx="760" cy="482" r="2"/><circle cx="725" cy="505" r="1.6"/>
    <circle cx="690" cy="522" r="2"/><circle cx="855" cy="355" r="1.4"/><circle cx="870" cy="415" r="1.4"/>
  </g>
  <!-- 内缘镂空 -->
  <ellipse cx="640" cy="400" rx="215" ry="100" fill="#070b16" stroke="#3a4a6b" stroke-width="1.5"/>

  <!-- 辐条 -->
  <g stroke="#4a5f8a" stroke-width="2">
    <line x1="640" y1="400" x2="640" y2="302"/>
    <line x1="640" y1="400" x2="640" y2="498"/>
    <line x1="640" y1="400" x2="431" y2="400"/>
    <line x1="640" y1="400" x2="849" y2="400"/>
  </g>
  <!-- 中央轴 -->
  <line x1="300" y1="400" x2="905" y2="400" stroke="#4a5f8a" stroke-width="1.5" stroke-dasharray="6 4" opacity=".7"/>

  <!-- 重力平衡舱 -->
  <circle cx="640" cy="400" r="26" fill="#7fd4ff" opacity=".15"/>
  <circle cx="640" cy="400" r="15" fill="#1a2a4a" stroke="#7fd4ff" stroke-width="2"/>
  <circle cx="640" cy="400" r="5" fill="#7fd4ff"/>

  <!-- 引擎舱 -->
  <path d="M 862 388 L 905 393 L 905 407 L 862 412 Z" fill="#23314f" stroke="#5a74a8" stroke-width="1.5"/>

  <!-- 标注 -->
  <g font-size="14" fill="#c9d6f2">
    <line x1="640" y1="258" x2="640" y2="200" stroke="#5a74a8" stroke-width="1"/>
    <text x="640" y="188" text-anchor="middle">农业环 · 闭环生态</text>

    <line x1="890" y1="382" x2="985" y2="322" stroke="#5a74a8" stroke-width="1"/>
    <text x="992" y="318">居住环 · 城市灯火</text>

    <line x1="386" y1="400" x2="300" y2="400" stroke="#5a74a8" stroke-width="1"/>
    <text x="292" y="405" text-anchor="end">水循环 · 海洋带</text>

    <line x1="640" y1="424" x2="640" y2="452" stroke="#5a74a8" stroke-width="1"/>
    <text x="640" y="470" text-anchor="middle" font-size="12" fill="#9db4dd">重力平衡舱</text>

    <line x1="883" y1="416" x2="883" y2="452" stroke="#5a74a8" stroke-width="1"/>
    <text x="883" y="470" text-anchor="middle" font-size="12" fill="#9db4dd">聚变引擎</text>

    <line x1="1020" y1="414" x2="1020" y2="486" stroke="#5a74a8" stroke-width="1"/>
    <text x="1020" y="504" text-anchor="middle" font-size="12" fill="#9db4dd">等离子尾焰 · 绵延数百公里</text>
  </g>

  <!-- 底部注记 -->
  <text x="60" y="742" font-size="13" fill="#8ea3cc">环径 2.4 km · 0.8 rpm 旋转重力 · 载员约 8,000 · 启航第 137 年</text>
  <text x="1140" y="742" font-size="11" fill="#5a6c94" text-anchor="end">pi 原创 · SVG 手绘 · 2026-08-13</text>
</svg>
